---
# Local development, under ~/.local/share:
#   ansible-playbook -i inventory.local.yml storage.yml
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become: false
      oats_storage_dir: "{{ ansible_env.HOME }}/.local/share/oats-store"
      oats_data_root: "{{ ansible_env.HOME }}/.local/share/oats-store/garage"
      oats_conf_dir: "{{ ansible_env.HOME }}/.local/share/oats-store/conf"
      oats_mc_path: "{{ ansible_env.HOME }}/.local/bin/mc"
