---
# Run the role in a systemd container: molecule test
driver:
  name: docker
platforms:
  - name: oats-store
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
