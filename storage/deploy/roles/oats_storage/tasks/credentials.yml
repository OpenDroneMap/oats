---
- name: Look for the writer key
  ansible.builtin.command: "{{ oats_garage }} key info {{ oats_key_name }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_key_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create the writer key
  ansible.builtin.command: "{{ oats_garage }} key create {{ oats_key_name }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  when: oats_key_check.rc != 0
  no_log: true

- name: Grant the writer key access to the bucket
  ansible.builtin.command: >-
    {{ oats_garage }} bucket allow --read --write --owner
    {{ oats_bucket }} --key {{ oats_key_name }}
  args:
    chdir: "{{ oats_storage_dir }}"
  when: oats_bucket_state.stdout is not search('RWO\s+\S+\s+' ~ oats_key_name)

# Garage holds the secret and will show it on demand, so the key is read back
# from the cluster rather than captured at creation.
- name: Read the writer key
  ansible.builtin.command: "{{ oats_garage }} key info --show-secret {{ oats_key_name }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_key_info
  changed_when: false
  no_log: true

- name: Load the writer credentials
  ansible.builtin.set_fact:
    oats_key_id: "{{ oats_key_info.stdout | regex_search('Key ID: (\\S+)', '\\1') | first }}"
    oats_key_secret: "{{ oats_key_info.stdout | regex_search('Secret key: (\\S+)', '\\1') | first }}"
  no_log: true

# A cache for anyone publishing by hand on the host; rewritten if it is lost.
- name: Store the writer credentials
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ oats_key_id }}
      AWS_SECRET_ACCESS_KEY={{ oats_key_secret }}
    dest: "{{ oats_writer_env }}"
    mode: "0600"
  no_log: true

- name: Copy the writer credentials to the control node
  ansible.builtin.fetch:
    src: "{{ oats_writer_env }}"
    dest: "{{ oats_fetch_dest }}"
    flat: true
  when: oats_fetch_writer_env | bool
