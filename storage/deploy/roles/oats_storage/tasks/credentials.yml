---
- name: Look for the writer key
  ansible.builtin.command: "{{ oats_garage }} key info {{ oats_key_name }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_key_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Create the writer key
  ansible.builtin.command: "{{ oats_garage }} key create {{ oats_key_name }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_key_new
  when: oats_key_check.rc != 0
  no_log: true

- name: Store the writer credentials
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ oats_key_new.stdout | regex_search('Key ID: (\S+)', '\1') | first }}
      AWS_SECRET_ACCESS_KEY={{ oats_key_new.stdout | regex_search('Secret key: (\S+)', '\1') | first }}
    dest: "{{ oats_writer_env }}"
    mode: "0600"
  when: oats_key_check.rc != 0
  no_log: true

- name: Grant the writer key access to the bucket
  ansible.builtin.command: >-
    {{ oats_garage }} bucket allow --read --write --owner
    {{ oats_bucket }} --key {{ oats_key_name }}
  args:
    chdir: "{{ oats_storage_dir }}"
  when: oats_bucket_state.stdout is not search('RWO\s+\S+\s+' ~ oats_key_name)

- name: Check that the writer credentials are on disk
  ansible.builtin.stat:
    path: "{{ oats_writer_env }}"
  register: oats_writer_stat

- name: Fail when the writer secret is unrecoverable
  ansible.builtin.fail:
    msg: >-
      The writer key exists in Garage but {{ oats_writer_env }} is missing, and
      Garage only reveals a secret at creation time. Delete the key
      ("garage key delete oats-writer") and re-run to issue a new one.
  when: not oats_writer_stat.stat.exists

- name: Read the writer credentials
  ansible.builtin.slurp:
    src: "{{ oats_writer_env }}"
  register: oats_writer_raw
  no_log: true

- name: Load the writer credentials
  ansible.builtin.set_fact:
    oats_key_id: "{{ oats_writer_raw.content | b64decode | regex_search('AWS_ACCESS_KEY_ID=(\\S+)', '\\1') | first }}"
    oats_key_secret: "{{ oats_writer_raw.content | b64decode | regex_search('AWS_SECRET_ACCESS_KEY=(\\S+)', '\\1') | first }}"
  no_log: true

- name: Copy the writer credentials to the control node
  ansible.builtin.fetch:
    src: "{{ oats_writer_env }}"
    dest: "{{ oats_fetch_dest }}"
    flat: true
  when: oats_fetch_writer_env | bool
