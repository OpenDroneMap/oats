---
- name: Wait for Garage to accept commands
  ansible.builtin.command: "{{ oats_garage }} status"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_status
  until: oats_status.rc == 0
  retries: 30
  delay: 1
  changed_when: false

- name: Give the node a layout role
  when: "'NO ROLE ASSIGNED' in oats_status.stdout"
  block:
    - name: Stage the node's role
      ansible.builtin.command: >-
        {{ oats_garage }} layout assign -z {{ oats_zone }} -c {{ oats_capacity }}
        {{ (oats_status.stdout_lines | select('search', 'NO ROLE ASSIGNED') | first).split() | first }}
      args:
        chdir: "{{ oats_storage_dir }}"

    - name: Read the staged layout version
      ansible.builtin.command: "{{ oats_garage }} layout show"
      args:
        chdir: "{{ oats_storage_dir }}"
      register: oats_layout
      changed_when: false

    - name: Apply the staged layout
      ansible.builtin.command: >-
        {{ oats_garage }} layout apply --version
        {{ (oats_layout.stdout | regex_search('layout version: (\d+)', '\1') | first | int) + 1 }}
      args:
        chdir: "{{ oats_storage_dir }}"

- name: Look for the bucket
  ansible.builtin.command: "{{ oats_garage }} bucket info {{ oats_bucket }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_bucket_check
  changed_when: false
  failed_when: false

- name: Create the bucket
  ansible.builtin.command: "{{ oats_garage }} bucket create {{ oats_bucket }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  when: oats_bucket_check.rc != 0

- name: Read the bucket's state
  ansible.builtin.command: "{{ oats_garage }} bucket info {{ oats_bucket }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  register: oats_bucket_state
  changed_when: false

# Anonymous read is served by Garage's web endpoint, enabled per bucket.
- name: Serve the bucket's objects anonymously
  ansible.builtin.command: "{{ oats_garage }} bucket website --allow {{ oats_bucket }}"
  args:
    chdir: "{{ oats_storage_dir }}"
  when: "'Website access: true' not in oats_bucket_state.stdout"
