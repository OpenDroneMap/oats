---
- name: Deploy the store
  environment:
    PATH: "{{ oats_bin_dir }}:{{ ansible_env.PATH }}"
    RUST_LOG: error
  block:
    - name: Install and start the Garage service
      ansible.builtin.import_tasks: service.yml

    - name: Open the bucket for anonymous reads
      ansible.builtin.import_tasks: bucket.yml

    - name: Publish the bucket under its hostname
      ansible.builtin.import_tasks: proxy.yml
      when: oats_public_hostname | length > 0

    - name: Show the new writer key, for the CI secrets
      ansible.builtin.debug:
        msg: "{{ oats_writer_key.stdout_lines | select('match', 'AWS_') }}"
      when: oats_writer_env_file.changed
