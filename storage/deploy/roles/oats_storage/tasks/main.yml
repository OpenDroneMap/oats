---
- name: Check that Docker is installed
  ansible.builtin.command: docker compose version
  changed_when: false
  register: oats_docker_check
  failed_when: oats_docker_check.rc != 0

- name: Prepare the data disk
  ansible.builtin.import_tasks: disk.yml
  when: oats_data_device | length > 0

- name: Deploy and start the Garage service
  ansible.builtin.import_tasks: service.yml

- name: Set up the cluster and its bucket
  ansible.builtin.import_tasks: cluster.yml

- name: Issue the writer key
  ansible.builtin.import_tasks: credentials.yml

- name: Open the bucket for browser reads
  ansible.builtin.import_tasks: access.yml

- name: Publish the bucket under its hostname
  ansible.builtin.import_tasks: proxy.yml
  when: oats_public_hostname | length > 0
