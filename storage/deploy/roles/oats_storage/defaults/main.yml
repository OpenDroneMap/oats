---
# Where publish_run.sh is deployed.
oats_storage_dir: /opt/oats-storage

# Garage's metadata and data. Mount a separate disk here first if wanted.
oats_data_root: /var/lib/garage

oats_bucket: oats-runs

# The bucket's public face: served by the web endpoint, readable from any origin.
oats_bucket_public:
  websiteAccess:
    enabled: true
    indexDocument: index.html
  corsRules:
    - AllowedOrigin: ["*"]
      AllowedMethod: [GET, HEAD]
      AllowedHeader: ["*"]
      ExposeHeader: [ETag, Content-Length, Content-Type]
      MaxAgeSeconds: 3600

# The S3 API (3900) and web endpoint (3902) listen here; RPC and admin stay on
# loopback.
oats_bind_addr: 0.0.0.0
oats_web_endpoint: http://127.0.0.1:3902
oats_admin_endpoint: http://127.0.0.1:3903

# garage is installed here, which the role puts on PATH.
oats_bin_dir: /usr/local/bin
oats_garage_version: v2.3.0
oats_garage_url: "https://garagehq.deuxfleurs.fr/_releases/{{ oats_garage_version }}/x86_64-unknown-linux-musl/garage"
# sha256sum of the download; Garage publishes none, so compute it on a bump.
oats_garage_sha256: f98d317942bb341151a2775162016bb50cf86b865d0108de03eb5db16e2120cd

# Garage runs under systemd as this user.
oats_service_user: garage

# Secrets, generated on the first run and printed once.
oats_conf_dir: /etc/oats
oats_writer_env: "{{ oats_conf_dir }}/writer.env"

# When set, the bucket is aliased to it. The vhost needs oats_nginx_manage.
oats_public_hostname: ""
oats_nginx_manage: false
oats_nginx_site_dir: /etc/nginx/sites-available
oats_nginx_enabled_dir: /etc/nginx/sites-enabled
