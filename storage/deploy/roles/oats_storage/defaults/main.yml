---
# Where compose.yaml, garage.toml and cors.xml are deployed.
oats_storage_dir: /opt/oats-storage

# Garage's metadata and data, on the data disk.
oats_data_mount: /data
oats_data_root: "{{ oats_data_mount }}/oats-garage"

# Formatted and mounted at oats_data_mount. Unset means no disks are touched.
oats_data_device: ""
oats_data_fstype: ext4

oats_bucket: oats-runs
oats_key_name: oats-writer
oats_zone: dc1
oats_capacity: 100G

# The CLI lives in the container; RUST_LOG quietens it.
oats_garage: docker compose exec -T -e RUST_LOG=error garage /garage
oats_s3_endpoint: http://127.0.0.1:3900
oats_web_endpoint: http://127.0.0.1:3902

# Root-only. Garage reveals a secret only at creation, so this is the only copy.
oats_conf_dir: /etc/oats
oats_writer_env: "{{ oats_conf_dir }}/writer.env"

# Copy the credentials to the control node, for the CI secret store.
oats_fetch_writer_env: false
oats_fetch_dest: ./writer.env

oats_mc_path: /usr/local/bin/mc
oats_mc_url: https://dl.min.io/client/mc/release/linux-amd64/mc

# When set, the bucket is aliased to it. The vhost needs oats_nginx_manage.
oats_public_hostname: ""
oats_nginx_manage: false
oats_nginx_site_dir: /etc/nginx/sites-available
oats_nginx_enabled_dir: /etc/nginx/sites-enabled
